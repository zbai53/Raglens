# RagLens local dev stack.
# `docker compose up -d` brings up all 6 services with healthchecks.
# See .env.example for the full env variable list.

services:
  clickhouse:
    # Note: -alpine variants have known jemalloc/lz4 issues on Apple Silicon;
    # use the debian-based image for stable arm64 support.
    image: clickhouse/clickhouse-server:24.8
    container_name: raglens-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP interface (used by browsers / curl)
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"   # Native TCP (used by drivers)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: raglens
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-raglens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-raglens}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      # /ping returns "Ok.\n" with 200. debian image has curl available.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: raglens-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raglens}
      POSTGRES_USER: ${POSTGRES_USER:-raglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raglens} -d ${POSTGRES_DB:-raglens}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: raglens-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: raglens-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant does not ship curl/wget in its slim image, use exec via /proc.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raglens-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override host-only URLs with in-network URLs.
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raglens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use node's built-in http client — no wget/curl needed, works on alpine
      # and matches the user (nextjs) that runs the server.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  clickhouse_data:
  clickhouse_logs:
  postgres_data:
  redis_data:
  qdrant_data:
